name: 🪟 Windows Builds

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              arch: x64,
            }
          - {
              arch: arm64,
            }

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Clang Compiler
        uses: egor-tensin/setup-clang@23bc15cd4207e45f1566447deb48f4ff3ef932cb # v2.3
        with:
          version: 20
        
      - name: Install System Dependencies
        shell: pwsh
        run: |
          choco install vulkan-sdk -y
          
          # Add Vulkan SDK paths to environment
          if (Test-Path "C:\VulkanSDK") {
              $vulkanVersion = (Get-ChildItem "C:\VulkanSDK")[0].Name
              echo "VULKAN_SDK=C:\VulkanSDK\$vulkanVersion" >> $env:GITHUB_ENV
              echo "C:\VulkanSDK\$vulkanVersion\Bin" >> $env:GITHUB_PATH
          }

      - name: Verify LLVM Toolchain and Module Scanner
        shell: pwsh
        run: |
          Get-Command clang
          Get-Command clang++
          Get-Command clang-scan-deps
          clang --version
          clang++ --version
          clang-scan-deps --version

      - name: Cache Build Artifacts
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ccache-
          max-size: "500M"

      - name: Configure Build System
        shell: pwsh
        env:
          COMPILER_TARGET: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
        run: |
          cmake --preset debug `
            -G Ninja `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            "-DCMAKE_C_COMPILER_TARGET=$env:COMPILER_TARGET" `
            "-DCMAKE_CXX_COMPILER_TARGET=$env:COMPILER_TARGET" `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Compile Target Binary
        shell: pwsh
        run: |
          cmake --build build/debug -j $([Environment]::ProcessorCount)

      - name: Run Unit Tests
        shell: pwsh
        run: |
          ctest --test-dir build/debug --output-on-failure -j $([Environment]::ProcessorCount)

      - name: Upload Engine Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows_${{ matrix.arch }}_debug
          path: build/debug/
          if-no-files-found: error
          retention-days: 7
