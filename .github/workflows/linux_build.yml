name: 🐧 Linux Builds

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux
    runs-on: ${{ format('ubuntu-24.04{0}', matrix.arch == 'arm64' && '-arm' || '') }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              arch: x64,
            }
          - {
              arch: arm64,
            }

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      
      - name: Set up Clang Compiler
        uses: egor-tensin/setup-clang@23bc15cd4207e45f1566447deb48f4ff3ef932cb # v2.3
        with:
          version: 20

      - name: Install System Dependencies
        env:
          REL_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'aarch64' }}
        run: |
          wget https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-linux-${REL_ARCH}.tar.gz
          wget https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-SHA-256.txt
          grep -F "  cmake-4.4.3-linux-${REL_ARCH}.tar.gz" cmake-4.4.3-SHA-256.txt | sha256sum --check -
          tar -xzf cmake-4.4.3-linux-${REL_ARCH}.tar.gz
          echo "$(pwd)/cmake-4.4.3-linux-${REL_ARCH}/bin" >> $GITHUB_PATH

          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            ccache \
            llvm-20 \
            llvm-20-tools \
            clang-tools-20 \
            libc++-20-dev \
            libc++abi-20-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libwayland-egl1-mesa \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libvulkan-dev \
            vulkan-tools
          echo "/usr/lib/llvm-20/bin" >> $GITHUB_PATH

      - name: Verify LLVM Toolchain
        run: |
          which clang
          which clang++
          which clang-scan-deps
          clang --version
          clang++ --version
          clang-scan-deps --version

      - name: Cache Build Artifacts
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ccache-
          max-size: "500M"

      - name: Configure Build System
        run: |
          cmake --preset debug \
            -B build/debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=TRUE \
            -DCMAKE_INSTALL_RPATH="\$ORIGIN:\$ORIGIN/engine/native"

      - name: Compile Target Binary
        run: |
          cmake --build build/debug -j$(nproc)

      - name: Run Unit Tests
        run: |
          ctest --test-dir build/debug --output-on-failure -j$(nproc)

      - name: Upload Engine Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux_${{ matrix.arch }}_debug
          path: build/debug/
          if-no-files-found: error
          retention-days: 7
